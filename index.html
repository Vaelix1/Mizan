<style>
[hidden]{display:none!important}
:root{
  --bg:#F4F5F2;--surface:#FFFFFF;--surface-2:#ECEEEA;--ink:#15191A;--ink-2:#4B5553;--ink-3:#5F6966;
  --line:#DADFDC;--line-2:#BEC6C2;--accent:#11694E;--accent-ink:#FFFFFF;--accent-soft:#DFF0E8;
  --debit:#1D4F91;--debit-soft:#E3EBF7;--credit:#A33526;--credit-soft:#F8E5E1;
  --warn:#6B4A00;--warn-soft:#FAEFD4;--ok:#15613F;--ok-soft:#DDEFE5;--err:#A33526;--err-soft:#F8E5E1;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
  --r:10px;--nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1113;--surface:#161A1D;--surface-2:#1E2327;--ink:#E6EAE8;--ink-2:#A8B2AE;--ink-3:#808B87;
  --line:#272D31;--line-2:#3A434A;--accent:#4DBF95;--accent-ink:#062017;--accent-soft:#15352A;
  --debit:#8FB5EE;--debit-soft:#16263B;--credit:#EF907F;--credit-soft:#3B1C17;
  --warn:#E9C47C;--warn-soft:#33280F;--ok:#6CCFA6;--ok-soft:#15352A;--err:#EF907F;--err-soft:#3B1C17;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1113;--surface:#161A1D;--surface-2:#1E2327;--ink:#E6EAE8;--ink-2:#A8B2AE;--ink-3:#808B87;
  --line:#272D31;--line-2:#3A434A;--accent:#4DBF95;--accent-ink:#062017;--accent-soft:#15352A;
  --debit:#8FB5EE;--debit-soft:#16263B;--credit:#EF907F;--credit-soft:#3B1C17;
  --warn:#E9C47C;--warn-soft:#33280F;--ok:#6CCFA6;--ok-soft:#15352A;--err:#EF907F;--err-soft:#3B1C17;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-tap-highlight-color:transparent}
button,select,input,label,summary,a{touch-action:manipulation}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.3;font-weight:650;text-wrap:balance}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1.05rem}h4{font-size:.95rem}
p{margin:0}
ul,ol{margin:0;padding-left:1.25rem}
li+li{margin-top:.3rem}
table{border-collapse:collapse}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:28px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.skip{position:absolute;left:-999px;top:0}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip:focus{left:8px;top:8px;z-index:50;background:var(--surface);padding:8px 12px;border-radius:8px}

/* ---------- 1. İSKELET ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
.content{min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar strong{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:20px 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px));max-width:860px;margin:0 auto;outline:none}
.page{display:flex;flex-direction:column;gap:24px}
/* Gizli sayfalar çizim durumunu korur; geri dönüldüğünde yeniden yerleşim gerekmez. */
@supports (content-visibility:hidden){
  .page[hidden]{display:flex!important;content-visibility:hidden;contain-intrinsic-size:0;height:0;overflow:hidden}
  .page[hidden].isin{content-visibility:visible;height:auto;overflow:visible;visibility:hidden}
}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--nav-h);
  border:0;background:none;color:var(--ink-3);font:500 .72rem/1.2 var(--sans);cursor:pointer;padding:0 2px}
.bottom button svg{width:24px;height:24px}
.bottom button[aria-current="page"]{color:var(--accent)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.icon-btn svg{width:20px;height:20px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:900px){
  .app{grid-template-columns:240px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .topbar,.bottom{display:none}
  main{padding:32px 32px 64px}
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand strong{display:block;font-size:1.15rem}
.brand small{display:block;color:var(--ink-3);font-size:.75rem;line-height:1.3}
.logo{flex:none;width:30px;height:30px;border-radius:8px;background:var(--accent);position:relative}
.logo::before{content:"";position:absolute;left:6px;right:6px;top:9px;height:3px;border-radius:2px;background:var(--accent-ink)}
.logo::after{content:"";position:absolute;left:13.5px;top:9px;bottom:6px;width:3px;border-radius:2px;background:var(--accent-ink)}
#sideNav{display:flex;flex-direction:column;gap:2px}
#sideNav button{text-align:left;border:0;background:none;color:var(--ink-2);font:inherit;font-size:.95rem;padding:9px 10px;border-radius:8px;cursor:pointer}
@media (hover:hover){#sideNav button:hover{background:var(--surface-2)}}
#sideNav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
#sideNav hr{border:0;border-top:1px solid var(--line);margin:8px 4px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px;font-size:.85rem;color:var(--ink-2)}

/* ---------- 2. FORM VE DÜĞME ---------- */
select,input,button,textarea{font:inherit;color:inherit}
select,input[type=text],input[type=number],input[type=search]{width:100%;max-width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:16px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.875rem;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
@media (hover:hover){.btn:hover{border-color:var(--ink-3)}}
.btn:active{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:active{filter:brightness(.92)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.small{min-height:40px;padding:6px 12px;font-size:.875rem}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{min-height:44px;min-width:64px;border:0;background:var(--surface);cursor:pointer;padding:0 12px;font-weight:500}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"].b{background:var(--debit);color:var(--surface)}
.seg button[aria-pressed="true"].a{background:var(--credit);color:var(--surface)}
.seg button[aria-pressed="true"].n{background:var(--accent);color:var(--accent-ink)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.err-text{font-size:.8rem;color:var(--err);min-height:1.1em}

/* ---------- 3. METİN BLOKLARI ---------- */
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.list{list-style:none;padding:0;margin:0}
.list>li{margin:0;padding:12px 0;border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.linkbtn{display:inline-flex;align-items:center;min-height:40px;background:none;border:0;padding:0;color:var(--accent);font:inherit;cursor:pointer;text-align:left}
.linkbtn.small{font-size:.875rem}
.note{border-radius:var(--r);padding:12px 14px;font-size:.93rem}
.note.info{background:var(--surface-2);color:var(--ink-2)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.err{background:var(--err-soft);color:var(--err)}
.tag{display:inline-block;font-size:.75rem;line-height:1.2;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.b{background:var(--debit-soft);color:var(--debit)}
.tag.a{background:var(--credit-soft);color:var(--credit)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.prose{display:flex;flex-direction:column;gap:12px;max-width:68ch}
.prose h3{margin-top:10px}
.formula{font-family:var(--mono);font-size:.92rem;background:var(--surface-2);border-radius:8px;padding:10px 12px;overflow-x:auto}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;font-size:.93rem}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
table.t{width:100%;font-size:.9rem}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:.8rem;color:var(--ink-3);font-weight:600}
table.t td.r,table.t th.r{text-align:right}
.big{font-size:2rem;font-weight:650;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:1.35rem;font-family:var(--mono)}
.stat span{font-size:.8rem;color:var(--ink-3)}
.bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 12px;min-height:44px;color:var(--ink-2);cursor:pointer;white-space:nowrap;font-weight:500;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* ---------- 4. MUHASEBE GÖRÜNÜMLERİ ---------- */
table.jr{width:100%;min-width:300px;font-size:.9rem}
table.jr caption{text-align:center;font:600 .78rem/1 var(--mono);color:var(--ink-3);padding-bottom:6px}
table.jr td{padding:5px 6px;border-bottom:1px solid var(--line)}
table.jr td.num{text-align:right;width:7.5rem;white-space:nowrap}
table.jr tr.b td.acc{color:var(--debit)}
table.jr tr.a td.acc{color:var(--credit);padding-left:2rem}
table.jr tr.x td{font-style:italic;color:var(--ink-3);font-size:.85rem;border-bottom:2px solid var(--line-2)}
.taccs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.tacc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.85rem}
.tacc h4{text-align:center;font-size:.85rem;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.tacc .cols{display:grid;grid-template-columns:1fr 1fr}
.tacc .cols>div{padding:4px 6px;min-height:2rem}
.tacc .cols>div:first-child{border-right:2px solid var(--ink)}
.tacc .ln{display:flex;justify-content:space-between;gap:6px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tacc .ln small{color:var(--ink-3)}
.tacc .tot{border-top:1px solid var(--line-2);margin-top:4px;padding-top:4px;font-weight:600}
.tacc .bal{text-align:center;margin-top:6px;color:var(--ink-2)}
.entry{display:flex;flex-direction:column;gap:10px}
.erow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,9rem) 44px;gap:8px;align-items:center}
.erow input{font-family:var(--mono);text-align:right}
.totals{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--ink-2)}
.totals b{font-family:var(--mono)}
@media (max-width:620px){
  .erow{grid-template-columns:minmax(0,1fr) 44px;grid-template-areas:"acc del" "side side" "amt amt";padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
  .erow .e-acc{grid-area:acc}.erow .e-side{grid-area:side}.erow .e-amt{grid-area:amt}.erow .e-del{grid-area:del}
  .erow .seg{display:grid;grid-template-columns:1fr 1fr}
}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps button{min-height:44px;min-width:56px;padding:4px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);cursor:pointer;font:500 .85rem var(--mono)}
.steps button[aria-current="step"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.steps button.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.acct{border-bottom:1px solid var(--line)}
.acct summary{display:flex;gap:12px;align-items:center;min-height:50px;padding:4px 0;cursor:pointer;list-style:none}
.gl{padding:12px 0;border-bottom:1px solid var(--line)}
.gl dt{font-weight:650}.gl dd{margin:4px 0 0;color:var(--ink-2)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:4px;font-size:.875rem;cursor:pointer}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--accent)}
.file-in{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.acct summary::-webkit-details-marker{display:none}
.acct summary:focus-visible{outline-offset:-2px}
.acct .code{font:600 1.05rem var(--mono);min-width:2.6rem}
summary{min-height:44px;padding:11px 0;cursor:pointer}
.acct .body{padding:2px 0 14px 3.6rem;display:flex;flex-direction:column;gap:8px;font-size:.92rem;color:var(--ink-2)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;min-height:48px;padding:10px 14px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);cursor:pointer;font:inherit;color:var(--ink)}
.opts button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opts button.wrong{background:var(--err-soft);border-color:var(--err);color:var(--err)}
.card{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.card .front{font-size:1.5rem;font-weight:650}
.card .back{font-size:1rem;color:var(--ink-2);max-width:40ch}
.menu{list-style:none;padding:0;margin:0}
.menu li{margin:0;border-bottom:1px solid var(--line)}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;padding:10px 4px;border:0;background:none;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.menu button small{display:block;color:var(--ink-3);font-size:.8rem}
.btn svg.i{width:18px;height:18px}
.gnorow{display:grid;gap:8px;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) 44px;align-items:end}
@media (max-width:480px){
  .gnorow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .gnorow .gn{grid-column:1/-1}
  table.jr{font-size:.82rem}table.jr td.num{width:5.8rem}table.jr tr.a td.acc{padding-left:1rem}
  .big{font-size:1.7rem}
}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:active{transform:scale(.99)}}
</style>

<div class="app">
  <aside class="side" aria-label="Bölümler">

<script>
(function () {
  'use strict';

  /* ---------- 1. YARDIMCILAR ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // Depolama kapalıysa (site verisi engelli, data: adresi, dolu kota) değerler sayfa açık kaldıkça bellekte tutulur.
  const STORAGE_OK = (() => { try { localStorage.setItem('mizan__', '1'); localStorage.removeItem('mizan__'); return true; } catch (e) { return false; } })();
  const MEM = new Map();
  const Store = {
    get(k, d) { try { const v = MEM.has(k) ? MEM.get(k) : localStorage.getItem('mizan_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { const s = JSON.stringify(v); try { localStorage.setItem('mizan_' + k, s); MEM.delete(k); } catch (e) { MEM.set(k, s); } },
    del(k) { MEM.delete(k); try { localStorage.removeItem('mizan_' + k); } catch (e) { /* depolama kapalı */ } }
  };

  const titleOf = (p, arg) => (p === 'konu' ? (TOPICS[arg] ? TOPICS[arg].t : 'Konu notu') : p === 'diger' ? 'Diğer' : (NAV.find((n) => n.id === p) || { t: 'Mizan' }).t);
  function parseHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h.startsWith('konu-') && TOPICS[h.slice(5)]) return ['konu', h.slice(5)];
    return [PAGES.includes(h) && h !== 'konu' ? h : 'ozet', null];
  }
  function go(page, arg, push = true) {
    if (page === 'konu' && !TOPICS[arg]) page = 'notlar';
    current = page; currentArg = page === 'konu' ? arg : null;
    if (page === 'nasil') Store.set('tanitim', 1);
    if (page === 'konu') renderKonu(arg); else ensure(page);
    PAGES.forEach((p) => { $('#p-' + p).hidden = p !== page; });
    const navId = PARENT[page] === 'notlar' ? 'notlar' : page;
    $$('#sideNav button').forEach((b) => b.setAttribute('aria-current', b.dataset.go === navId ? 'page' : 'false'));
    const bottomId = ['ozet', 'notlar', 'alistirma', 'tekrar'].includes(navId) ? navId : 'diger';
    $$('#bottomNav button').forEach((b) => b.setAttribute('aria-current', b.dataset.go === bottomId ? 'page' : 'false'));
    $('#topTitle').textContent = page === 'ozet' ? 'Mizan' : titleOf(page, arg);
    document.title = page === 'ozet' ? 'Mizan' : titleOf(page, arg) + ' · Mizan';
    const hash = page === 'konu' ? 'konu-' + arg : page;
    if (push && location.hash.slice(1) !== hash) { try { history.pushState(null, '', '#' + hash); } catch (e) { /* çerçeve izin vermezse */ } }
    window.scrollTo(0, 0);
  }
  function renderNav() {
    $('#sideNav').innerHTML = NAV.map((n) => (n.sep ? '<hr>' : '<button type="button" data-go="' + n.id + '">' + esc(n.t) + '</button>')).join('');
    $('#bottomNav').innerHTML = NAV.filter((n) => n.icon).map((n) => '<button type="button" data-go="' + n.id + '">' + icon(n.icon) + '<span>' + esc(n.s || n.t) + '</span></button>').join('') +
      '<button type="button" data-go="diger">' + icon('diger') + '<span>Diğer</span></button>';
    syncCampus();
  }
  const CAMPUS_OPTIONS = Object.entries(CAMPUS).map(([k, c]) => '<option value="' + k + '">' + esc(c.label) + '</option>').join('');
  function syncCampus(root = document) {
    $$('[data-campus]', root).forEach((s) => { if (!s.options.length) s.innerHTML = CAMPUS_OPTIONS; s.value = campusKey; });
  }

  /* ---------- 15. ÖZET ---------- */
  function phaseText(ph) {
    const T = TERMS[ph.term || 'guz'];
    switch (ph.kind) {
      case 'week': return [TERM_LABEL[ph.term] + ', ' + ph.n + '. hafta', ph.term === 'bahar' ? 'Bahar döneminde Genel Muhasebe II var; bu uygulama güz dönemi derslerini kapsıyor.' : ''];
      case 'midterm': return ['Ara sınav haftası', fRange(T.midterm[0], T.midterm[1]) + '. Bu hafta ders yapılmıyor.'];
      case 'finals': return ['Final haftası', fRange(T.finals[0], T.finals[1]) + '. Dersi geçmek için final notu en az 50.'];
      case 'makeup': return ['Bütünleme haftası', fRange(T.makeup[0], T.makeup[1]) + '.'];
      case 'break': return ['Bayram haftası', 'Ders yapılmıyor.'];
      case 'gap': return ['Sınav arası', 'Bütünleme sınavlarının başlangıcı: ' + fDate(T.makeup[0]) + '.'];
      case 'semester': return ['Yarıyıl tatili', 'Bahar dersleri ' + fDate(TERMS.bahar.weeks[0], { day: 'numeric', month: 'long', year: 'numeric' }) + ' tarihinde başlıyor.'];
      case 'summer': return ['Yaz dönemi', 'Eğitim yılı bitti.'];
      case 'pre': return ['Dönem başlamadı', 'Güz dersleri ' + fDate(TERMS.guz.weeks[0], { day: 'numeric', month: 'long', year: 'numeric' }) + ' tarihinde başlıyor.'];
      default: return ['Takvim güncel değil', ''];
    }
  }
  function topicButtons(keys) {
    return keys.map((k) => '<button type="button" class="btn small" data-konu="' + k + '">' + esc(TOPICS[k].t) + '</button>').join('');
  }
  function renderOzet() {
    const ph = phase(), c = camp(), [head, sub] = phaseText(ph);
    const upcoming = STALE ? [] : CAL.filter((e) => e.B >= TODAY).slice(0, 3);
    let week = '';
    if (isGuzWeek(ph)) {
      const w = c.weeks[ph.n - 1], next = c.weeks[ph.n];
      week = '<section class="stack"><h2>Genel Muhasebe I</h2><div class="box stack"><p class="small muted">' + esc(c.code) + ' · ' + ph.n + '. hafta · ' + weekRange(ph.n - 1) + '</p><p><strong>' + esc(w.t) + '</strong></p>' +
        (w.k.length ? '<div class="row">' + topicButtons(w.k) + '</div>' : '<p class="small muted">Bu hafta konu anlatımı yok.</p>') +
        (next ? '<p class="small muted">Sonraki hafta: ' + esc(next.t) + '</p>' : '') + '</div></section>';
    }
    const abcN = ABC.filter((_, i) => abcDone[i]).length;
    const allCards = Object.values(DECKS).reduce((p, d) => p + d.cards.length, 0);
    const known = Object.values(DECKS).reduce((p, d) => p + d.cards.filter((cd) => boxOf(cd.id) >= 4).length, 0);
    const last = quizHist[quizHist.length - 1];
    const intro = Store.get('tanitim', 0) ? '' :
      '<section class="box stack" id="introBox"><h2>Mizan\'a başlarken</h2><p>Genel Muhasebe I ve ilk dönemin diğer dersleri için konu notları, yevmiye alıştırmaları, tekrar ve hesap araçları. Önce kampüsünü seç; haftalık plan ve ders kodları buna göre değişir. Bütün veriler bu cihazda kalır.</p>' +
      '<div class="row"><button type="button" class="btn primary" data-go="nasil">Nasıl kullanılır</button><button type="button" class="btn ghost" data-intro-close>Kapat</button></div></section>';
    $('#p-ozet').innerHTML =
      '<header class="stack"><h1>' + esc(head) + '</h1><div class="row between"><p class="muted">' + esc(fDate(TODAY, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })) + (DEMO_DATE ? ' (deneme tarihi)' : '') + '</p>' +
        '<label class="row small muted" for="campusOzet">Kampüs <select id="campusOzet" data-campus style="width:auto"></select></label></div>' + (sub ? '<p class="muted">' + esc(sub) + '</p>' : '') + '</header>' +
      intro +
      (STORAGE_OK ? '' : '<div class="note warn">Bu tarayıcıda site verisi kapalı; çalışmalar sayfa kapanınca silinir.</div>') +
      (ph.kind === 'stale' ? '<div class="note err">Bu sürümdeki takvim ' + esc(YEAR_KEY) + ' eğitim yılına ait. Güncel tarihler için ' + srcLink('takvim-sayfa', 'TOGÜ akademik takvim sayfası') + '.</div>' : '') +
      week +
      '<section class="stack"><div class="row between"><h2>Yaklaşan tarihler</h2><button type="button" class="linkbtn small" data-go="takvim">Takvim</button></div>' +
        (upcoming.length ? '<ul class="list">' + upcoming.map((e) => { const n = days(TODAY, e.A); return '<li class="row between"><span><strong>' + esc(e.t) + '</strong><br><span class="small muted">' + fRange(e.A, e.B) + '</span></span><span class="tag' + (n <= 7 ? ' warn' : '') + '">' + (TODAY >= e.A ? 'sürüyor' : n === 1 ? 'yarın' : n + ' gün') + '</span></li>'; }).join('') + '</ul>'
          : '<p class="muted small">Yaklaşan tarih yok.</p>') + '</section>' +
      '<section class="stack"><h2>Çalışma durumu</h2><div class="stats">' +
        '<div class="stat"><b>' + abcN + '/' + ABC.length + '</b><span>ABC Ticaret kayıtları</span></div>' +
        '<div class="stat"><b>' + practice.dogru + '/' + practice.toplam + '</b><span>Serbest alıştırma (doğru/toplam)</span></div>' +
        '<div class="stat"><b>' + known + '/' + allCards + '</b><span>Öğrenilen kart</span></div>' +
        '<div class="stat"><b>' + (last ? last.d + '/' + last.n : '—') + '</b><span>Son test</span></div>' +
      '</div></section>';
    syncCampus($('#p-ozet'));
  }

  /* ---------- 16. KONU NOTLARI ---------- */
  function renderNotlar() {
    const c = camp(), ph = phase();
    let rows = '';
    c.weeks.forEach((w, i) => {
      const now = isGuzWeek(ph) && ph.n === i + 1;
      rows += '<li class="stack" style="gap:6px"><div class="row between"><span class="small muted">' + (i + 1) + '. hafta · ' + weekRange(i) + '</span>' + (now ? '<span class="tag ok">Bu hafta</span>' : '') + '</div>' +
        '<span>' + esc(w.t) + '</span>' + (w.k.length ? '<div class="row">' + topicButtons(w.k) + '</div>' : '') + '</li>';
      if (i === 7) rows += '<li><span class="small muted">' + fRange(TERMS.guz.midterm[0], TERMS.guz.midterm[1]) + '</span><br><strong>Ara sınav haftası</strong></li>';
    });
    rows += '<li><span class="small muted">' + fRange(TERMS.guz.finals[0], TERMS.guz.finals[1]) + ' · bütünleme ' + fRange(TERMS.guz.makeup[0], TERMS.guz.makeup[1]) + '</span><br><strong>Final ve bütünleme</strong></li>';
    $('#p-notlar').innerHTML =
      '<header class="stack"><h1>Konu notları</h1><p class="muted">Genel Muhasebe I · ' + esc(c.code) + ' · ' + esc(c.label) + '. Haftalık sıra ' + srcLink(c.src, 'program kılavuzundan') + ', tarihler ' + esc(YEAR_KEY) + ' akademik takviminden.</p></header>' +
      '<ul class="list">' + rows + '</ul>';
  }
  function renderBlocks(blocks) {
    return blocks.map((x) => {
      if (x.h) return '<h3>' + esc(x.h) + '</h3>';
      if (x.p) return '<p>' + esc(x.p) + '</p>';
      if (x.ul) return '<ul>' + x.ul.map((i) => '<li>' + esc(i) + '</li>').join('') + '</ul>';
      if (x.ol) return '<ol>' + x.ol.map((i) => '<li>' + esc(i) + '</li>').join('') + '</ol>';
      if (x.f) return '<div class="formula">' + esc(x.f).replace(/\n/g, '<br>') + '</div>';
      if (x.tbl) return '<div class="scroll"><table class="t"><thead><tr>' + x.tbl.head.map((h) => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
        x.tbl.rows.map((r) => '<tr>' + r.map((cc) => '<td>' + esc(cc) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
      if (x.ex) return '<div class="box stack"><p><strong>Örnek.</strong> ' + esc(x.ex.q) + '</p><div class="scroll">' + journalTable(x.ex.sol) + '</div>' + (x.ex.x ? '<p class="small muted">' + esc(x.ex.x) + '</p>' : '') + '</div>';
      return '';
    }).join('');
  }
  function renderKonu(id) {
    const tp = TOPICS[id], i = TOPIC_ORDER.indexOf(id), wk = weeksOfTopic(id);
    const accs = ACCOUNTS.filter((a) => a.topic === id);
    const hasPractice = TEMPLATES.some((t) => t.topic === id);
    const prev = TOPIC_ORDER[i - 1], next = TOPIC_ORDER[i + 1];
    $('#p-konu').innerHTML =
      '<div><button type="button" class="linkbtn small" data-go="notlar">← Konu notları</button></div>' +
      '<header class="stack"><h1>' + esc(tp.t) + '</h1>' + (wk.length ? '<p class="small muted">Genel Muhasebe I · ' + esc(camp().label) + ': ' + wk.join(', ') + '. hafta</p>' : '') + '</header>' +
      '<article class="prose">' + renderBlocks(tp.b) + '</article>' +
      (accs.length ? '<section class="stack"><h2>Bu konunun hesapları</h2><ul class="list">' + accs.map((a) => '<li class="row between" style="padding:4px 0"><button type="button" class="linkbtn" data-hesap="' + a.code + '"><span class="mono" style="margin-right:8px">' + a.code + '</span>' + esc(a.name) + '</button><span class="tag ' + (a.up === 'B' ? 'b' : 'a') + '">' + (a.up === 'B' ? 'Borçta artar' : 'Alacakta artar') + '</span></li>').join('') + '</ul></section>' : '') +
      (hasPractice ? '<div><button type="button" class="btn primary" data-pratik="' + id + '">Bu konudan alıştırma yap</button></div>' : '') +
      '<nav class="row between" aria-label="Konular arası">' + (prev ? '<button type="button" class="btn small" data-konu="' + prev + '">← ' + esc(TOPICS[prev].t) + '</button>' : '<span></span>') +
        (next ? '<button type="button" class="btn small" data-konu="' + next + '">' + esc(TOPICS[next].t) + ' →</button>' : '') + '</nav>';
  }

  /* ---------- 17. HESAP PLANI ---------- */
  let accFilter = { q: '', cls: '' };
  function renderHesaplar() {
    const page = $('#p-hesaplar');
    if (!page.dataset.ready) {
      page.innerHTML =
        '<header class="stack"><h1>Hesap planı</h1><p class="muted">Tek düzen hesap planından ilk yıl derslerinde geçen ' + ACCOUNTS.length + ' hesap. Kodun ilk hanesi sınıfı, ilk iki hanesi grubu gösterir: 153 → 1 Dönen Varlıklar, 15 Stoklar, 153 Ticari Mallar.</p></header>' +
        '<div class="scroll"><table class="t"><thead><tr><th>Hesap türü</th><th>Artış</th><th>Azalış</th><th>Bakiye</th></tr></thead><tbody>' +
          '<tr><td>Varlık (1, 2)</td><td>Borç</td><td>Alacak</td><td>Borç</td></tr><tr><td>Kaynak (3, 4, 5)</td><td>Alacak</td><td>Borç</td><td>Alacak</td></tr>' +
          '<tr><td>Gider</td><td>Borç</td><td>—</td><td>Borç</td></tr><tr><td>Gelir</td><td>Alacak</td><td>—</td><td>Alacak</td></tr><tr><td>Düzenleyici (-)</td><td colspan="3">Bağlı olduğu grubun tersi</td></tr></tbody></table></div>' +
        '<div class="form"><label class="f" for="accQ">Ara<input type="search" id="accQ" placeholder="Kod ya da ad: 191, satıcılar" autocomplete="off"></label>' +
          '<label class="f" for="accCls">Sınıf<select id="accCls"><option value="">Tümü</option>' + Object.entries(CLASSES).map(([k, v]) => '<option value="' + k + '">' + k + ' ' + esc(v) + '</option>').join('') + '</select></label></div>' +
        '<div id="accList"></div>';
      page.dataset.ready = '1';
      $('#accQ').addEventListener('input', (e) => { accFilter.q = e.target.value; drawAccounts(); });
      $('#accCls').addEventListener('change', (e) => { accFilter.cls = e.target.value; drawAccounts(); });
    }
    $('#accQ').value = accFilter.q; $('#accCls').value = accFilter.cls;
    drawAccounts();
  }
  let accSearch = null;
  function drawAccounts() {
    const q = trLower(accFilter.q.trim());
    if (q && !accSearch) accSearch = new Map(ACCOUNTS.map((a) => [a.code, trLower(a.code + ' ' + a.name + ' ' + a.text)]));
    const list = ACCOUNTS.filter((a) => (!accFilter.cls || a.cls === accFilter.cls) && (!q || accSearch.get(a.code).includes(q)));
    if (!list.length) { $('#accList').innerHTML = '<p class="muted">Sonuç yok.</p>'; return; }
    let html = '', lastGrp = '';
    list.forEach((a) => {
      if (a.grp !== lastGrp) { html += '<h3 style="margin-top:18px">' + a.grp + ' ' + esc(GROUPS[a.grp] || '') + '<span class="small muted" style="font-weight:400"> · ' + a.cls + ' ' + esc(CLASSES[a.cls]) + '</span></h3>'; lastGrp = a.grp; }
      const wk = weeksOfTopic(a.topic);
      html += '<details class="acct" id="acc-' + a.code + '"' + (q === a.code ? ' open' : '') + '><summary><span class="code">' + a.code + '</span><span style="flex:1">' + esc(a.name) + '</span><span class="tag ' + (a.up === 'B' ? 'b' : 'a') + '" title="' + (a.up === 'B' ? 'Borç tarafında artar' : 'Alacak tarafında artar') + '"><span aria-hidden="true">' + (a.up === 'B' ? 'B' : 'A') + '</span><span class="sr">' + (a.up === 'B' ? 'Borç tarafında artar' : 'Alacak tarafında artar') + '</span></span></summary>' +
        '<div class="body"><p>' + esc(a.text) + '</p><p>Artış: ' + (a.up === 'B' ? 'borç' : 'alacak') + ' · Azalış: ' + (a.up === 'B' ? 'alacak' : 'borç') + ' · Normal bakiye: ' + (a.up === 'B' ? 'borç' : 'alacak') + (a.minus ? ' · Düzenleyici hesap' : '') + '</p>' +
        '<div class="row"><button type="button" class="linkbtn small" data-konu="' + a.topic + '">Konu: ' + esc(TOPICS[a.topic].t) + '</button>' + (wk.length ? '<span class="small muted">(' + wk.join(', ') + '. hafta)</span>' : '') + '</div></div></details>';
    });
    $('#accList').innerHTML = html;
  }

  /* ---------- 18. SÖZLÜK ---------- */
  let GLOSS_SORTED = null;
  function renderSozluk() {
    if (!GLOSS_SORTED) { const coll = new Intl.Collator('tr'); GLOSS_SORTED = GLOSSARY.map(([t, d]) => [t, d, trLower(t + ' ' + d)]).sort((x, y) => coll.compare(x[0], y[0])); }
    const page = $('#p-sozluk');
    if (!page.dataset.ready) {
      page.innerHTML = '<header class="stack"><h1>Sözlük</h1><p class="muted">' + GLOSSARY.length + ' terim.</p></header>' +
        '<label class="f" for="gloQ">Ara<input type="search" id="gloQ" placeholder="Terim ya da açıklamada geçen kelime" autocomplete="off"></label><dl id="gloList" style="margin:0"></dl>';
      page.dataset.ready = '1';
      $('#gloQ').addEventListener('input', drawGlossary);
    }
    drawGlossary();
  }
  function drawGlossary() {
    const q = trLower(($('#gloQ') || { value: '' }).value.trim());
    const list = GLOSS_SORTED.filter((g) => !q || g[2].includes(q));
    $('#gloList').innerHTML = list.length ? list.map(([t, d]) => '<div class="gl"><dt>' + esc(t) + '</dt><dd>' + esc(d) + '</dd></div>').join('') : '<div class="muted" style="padding:12px 0">Sonuç yok.</div>';
  }

  /* ---------- 19. YEVMİYE KAYDI: GÖRÜNÜM VE DENETİM ---------- */
  function journalTable(sol, caption, expl) {
    const row = (l, s) => '<tr class="' + s.toLowerCase() + '"><td class="acc">' + esc(accLabel(l[0])) + '</td><td class="num">' + (s === 'B' ? money(l[2]) : '') + '</td><td class="num">' + (s === 'A' ? money(l[2]) : '') + '</td></tr>';
    return '<table class="jr">' + (caption ? '<caption>' + esc(caption) + '</caption>' : '') + '<tbody>' +
      sol.filter((l) => l[1] === 'B').map((l) => row(l, 'B')).join('') + sol.filter((l) => l[1] === 'A').map((l) => row(l, 'A')).join('') +
      (expl ? '<tr class="x"><td colspan="3">' + esc(expl) + '</td></tr>' : '') + '</tbody></table>';
  }
  const ACC_OPTIONS = '<option value="">Hesap seç</option>' + Object.entries(CLASSES).map(([k, v]) => '<optgroup label="' + k + ' ' + esc(v) + '">' +
    ACCOUNTS.filter((a) => a.cls === k).map((a) => '<option value="' + a.code + '">' + esc(accLabel(a.code)) + '</option>').join('') + '</optgroup>').join('');
  const blankRows = (n = 3) => Array.from({ length: n }, () => ({ a: '', s: '', t: '' }));
  function rowHtml(key, k, r) {
    return '<div class="erow" data-k="' + k + '"><select class="e-acc" id="' + key + '-a' + k + '" aria-label="' + (k + 1) + '. satır hesap">' + ACC_OPTIONS + '</select>' +
      '<div class="seg e-side" role="group" aria-label="' + (k + 1) + '. satır taraf"><button type="button" class="b" data-side="B" aria-pressed="' + (r.s === 'B') + '">Borç</button><button type="button" class="a" data-side="A" aria-pressed="' + (r.s === 'A') + '">Alacak</button></div>' +
      '<input class="e-amt" id="' + key + '-t' + k + '" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="Tutar" aria-label="' + (k + 1) + '. satır tutar" value="' + esc(r.t) + '">' +
      '<button type="button" class="icon-btn e-del" data-del="' + k + '" aria-label="' + (k + 1) + '. satırı sil">×</button></div>';
  }
  function entryHtml(key, rows) {
    return '<div class="entry" data-entry="' + key + '">' + rows.map((r, k) => rowHtml(key, k, r)).join('') + '</div><div class="totals" data-totals="' + key + '"></div>';
  }
  // Satır eklenip silinince yalnızca o satır değişir; numaralar ve etiketler yeniden yazılır.
  function renumber(key) {
    $$('[data-entry="' + key + '"] .erow').forEach((row, k) => {
      row.dataset.k = k;
      const a = $('.e-acc', row), t = $('.e-amt', row), d = $('.e-del', row);
      a.id = key + '-a' + k; a.setAttribute('aria-label', (k + 1) + '. satır hesap');
      $('.e-side', row).setAttribute('aria-label', (k + 1) + '. satır taraf');
      t.id = key + '-t' + k; t.setAttribute('aria-label', (k + 1) + '. satır tutar');
      d.dataset.del = k; d.setAttribute('aria-label', (k + 1) + '. satırı sil');
    });
  }
  function fillSelects(key, rows) { $$('[data-entry="' + key + '"] .e-acc').forEach((s, k) => { s.value = rows[k] && ACC[rows[k].a] ? rows[k].a : ''; }); }
  function readRows(key) {
    return $$('[data-entry="' + key + '"] .erow').map((row) => {
      const p = $('.e-side [aria-pressed="true"]', row);
      return { a: $('.e-acc', row).value, s: p ? p.dataset.side : '', t: $('.e-amt', row).value };
    });
  }
  function drawTotals(key) {
    const el = $('[data-totals="' + key + '"]');
    if (!el) return;
    let b = 0, a = 0;
    readRows(key).forEach((r) => { const v = parseAmount(r.t); if (v > 0) { if (r.s === 'B') b += cents(v); if (r.s === 'A') a += cents(v); } });
    el.innerHTML = 'Borç <b>' + money(b / 100) + '</b> Alacak <b>' + money(a / 100) + '</b>' + (b || a ? ' <span class="tag ' + (b === a ? 'ok' : 'warn') + '">' + (b === a ? 'Denk' : 'Fark ' + money(Math.abs(b - a) / 100)) + '</span>' : '');
  }
  function checkRows(rows, sol, kdvBase) {
    const err = (m) => ({ kind: 'err', msg: m });
    const used = rows.map((r, k) => ({ ...r, line: k + 1 })).filter((r) => r.a || r.s || String(r.t).trim());
    if (used.length < 2) return err('En az iki satır doldur: bir borçlu, bir alacaklı hesap.');
    for (const r of used) {
      if (!r.a) return err(r.line + '. satırda hesap seçilmedi.');
      if (!r.s) return err(r.line + '. satırda borç ya da alacak seçilmedi.');
      if (!(parseAmount(r.t) > 0)) return err(r.line + '. satırdaki tutar okunamadı. 15000 ya da 15.000 biçiminde yaz.');
    }
    if (kdvBase) {
      const olds = [cents(kdvBase * 0.18), cents(kdvBase * 0.08)];
      const hit = used.find((r) => (r.a === '191' || r.a === '391') && olds.includes(cents(parseAmount(r.t))));
      if (hit) return { kind: 'warn', msg: '<strong>Eski KDV oranı.</strong> ' + esc(accLabel(hit.a)) + ' satırındaki ' + money(parseAmount(hit.t)) + ' TL, %18 ya da %8 ile hesaplanmış. Genel oran 10 Temmuz 2023\'ten beri %20: ' + money(kdvBase) + ' × %20 = ' + money(kdvBase * 0.2) + ' TL.' };
    }
    let b = 0, a = 0;
    used.forEach((r) => { const v = cents(parseAmount(r.t)); if (r.s === 'B') b += v; else a += v; });
    if (b !== a) return err('<strong>Kayıt denk değil.</strong> Borç toplamı ' + money(b / 100) + ' TL, alacak toplamı ' + money(a / 100) + ' TL; fark ' + money(Math.abs(b - a) / 100) + ' TL.');
    const sum = (list) => { const m = {}; list.forEach(([c, s, v]) => { m[c + s] = (m[c + s] || 0) + cents(v); }); return m; };
    const mine = sum(used.map((r) => [r.a, r.s, parseAmount(r.t)])), want = sum(sol), issues = [];
    Object.keys(want).forEach((k) => {
      const code = k.slice(0, 3), other = code + (k[3] === 'B' ? 'A' : 'B');
      if (mine[k] === want[k]) return;
      if (mine[k] == null && mine[other] != null) issues.push(esc(accLabel(code)) + ' ters tarafta; ' + (k[3] === 'B' ? 'borç' : 'alacak') + ' tarafına yazılır.');
      else if (mine[k] == null) issues.push(esc(accLabel(code)) + ' eksik.');
      else issues.push(esc(accLabel(code)) + ' tutarı yanlış (' + money(mine[k] / 100) + ' TL yazıldı).');
    });
    Object.keys(mine).forEach((k) => { const code = k.slice(0, 3), other = code + (k[3] === 'B' ? 'A' : 'B'); if (want[k] == null && want[other] == null) issues.push(esc(accLabel(code)) + ' bu işlemde kullanılmıyor.'); });
    if (issues.length) return { kind: 'warn', msg: '<strong>Kayıt denk ama doğru değil.</strong><ul style="margin-top:6px">' + issues.slice(0, 4).map((x) => '<li>' + x + '</li>').join('') + '</ul>' };
    return { kind: 'ok' };
  }

  /* ---------- 20. ALIŞTIRMA SAYFASI ---------- */
  let pracTab = Store.get('pratikSekme', 'abc') === 'serbest' ? 'serbest' : 'abc';
  const abcDrafts = {};
  const free = { topic: '', item: null, rows: blankRows(), revealed: false, counted: false, lastId: '' };
  function renderAlistirma() {
    $('#p-alistirma').innerHTML = '<header class="stack"><h1>Alıştırma</h1></header>' +
      '<div class="tabs" role="tablist"><button type="button" role="tab" id="tab-abc" aria-controls="pracBody" data-tab="abc" aria-selected="' + (pracTab === 'abc') + '">ABC Ticaret</button><button type="button" role="tab" id="tab-serbest" aria-controls="pracBody" data-tab="serbest" aria-selected="' + (pracTab === 'serbest') + '">Serbest alıştırma</button></div>' +

    if (pracTab === 'abc') renderAbc(); else renderFree();
  }
  function renderAbc() {
    const ex = ABC[abcIndex], rows = abcDrafts[abcIndex] || (abcDrafts[abcIndex] = blankRows());
    $('#pracBody').innerHTML =
      '<p class="muted">Aralık ayında kurulan ABC Ticaret\'in on kaydı. Tokat program kılavuzundaki Genel Muhasebe I örneğinden alındı; KDV güncel oranla (%20) hesaplandı.</p>' +
      '<div class="steps">' + ABC.map((e, i) => '<button type="button" data-step="' + i + '" class="' + (abcDone[i] ? 'done' : '') + '"' + (i === abcIndex ? ' aria-current="step"' : '') + ' aria-label="' + esc(e.date + ' ' + e.title) + '">' + e.date + '</button>').join('') + '</div>' +
      '<section class="box stack"><div class="row between"><h2>' + esc(ex.date + ' · ' + ex.title) + '</h2><span id="abcDoneTag">' + (abcDone[abcIndex] ? '<span class="tag ok">Tamamlandı</span>' : '') + '</span></div><p>' + esc(ex.q) + '</p>' +
        entryHtml('abc', rows) +
        '<div class="row"><button type="button" class="btn" data-add="abc">Satır ekle</button><button type="button" class="btn primary" data-check="abc">Kontrol et</button><button type="button" class="btn ghost" data-show="abc">Çözüm</button>' +
          (abcIndex < ABC.length - 1 ? '<button type="button" class="btn' + (abcDone[abcIndex] ? '' : ' ghost') + '" data-step="' + (abcIndex + 1) + '" id="abcNext">Sonraki →</button>' : '') + '</div>' +
        '<div data-fb="abc" aria-live="polite"></div></section><div id="ledger" class="stack-lg">' + ledgerHtml() + '</div>';
    fillSelects('abc', rows); drawTotals('abc');
  }
  // Kayıt tamamlanınca yalnızca durum işaretleri ve defter güncellenir.
  function abcStatus() {
    $$('.steps [data-step]').forEach((b) => b.classList.toggle('done', !!abcDone[+b.dataset.step]));
    const tag = $('#abcDoneTag'); if (tag) tag.innerHTML = abcDone[abcIndex] ? '<span class="tag ok">Tamamlandı</span>' : '';
    const next = $('#abcNext'); if (next) next.classList.toggle('ghost', !abcDone[abcIndex]);

  }
  function ledgerHtml() {
    const doneList = ABC.filter((_, i) => abcDone[i]);
    if (!doneList.length) return '<section class="stack"><h2>Büyük defter ve mizan</h2><p class="muted small">Tamamlanan kayıtlar burada T hesaplara ve mizana aktarılır.</p></section>';
    const acc = {};
    doneList.forEach((e) => e.sol.forEach(([c, s, v]) => { (acc[c] = acc[c] || { B: [], A: [] })[s].push([e.date, v]); }));
    const codes = Object.keys(acc).sort(), total = (l) => l.reduce((p, x) => p + x[1], 0);
    const side = (l) => l.map(([dt, v]) => '<div class="ln"><small>' + dt + '</small><span>' + money(v, 0) + '</span></div>').join('') + (l.length > 1 ? '<div class="ln tot"><small>Top.</small><span>' + money(total(l), 0) + '</span></div>' : '');
    let tb = 0, ta = 0, tbb = 0, tab = 0, rows = '', taccs = '';
    codes.forEach((c) => {
      const b = total(acc[c].B), a = total(acc[c].A), d = b - a;
      tb += b; ta += a; if (d > 0) tbb += d; else tab -= d;
      taccs += '<div class="tacc"><h4>' + esc(accLabel(c)) + '</h4><div class="cols"><div>' + side(acc[c].B) + '</div><div>' + side(acc[c].A) + '</div></div><div class="bal">' + (d === 0 ? 'Bakiye yok' : (d > 0 ? 'Borç bakiyesi ' : 'Alacak bakiyesi ') + money(Math.abs(d), 0)) + '</div></div>';
      rows += '<tr><td>' + esc(accLabel(c)) + '</td><td class="r num">' + money(b, 0) + '</td><td class="r num">' + money(a, 0) + '</td><td class="r num">' + (d === 0 ? '—' : money(Math.abs(d), 0) + (d > 0 ? ' B' : ' A')) + '</td></tr>';
    });
    const eq = tb === ta && tbb === tab;
    return '<section class="stack"><h2>Büyük defter</h2><div class="taccs">' + taccs + '</div></section>' +
      '<section class="stack"><h2>Mizan</h2><div class="scroll"><table class="t"><thead><tr><th>Hesap</th><th class="r">Borç</th><th class="r">Alacak</th><th class="r">Bakiye</th></tr></thead><tbody>' + rows +
      '</tbody><tfoot><tr><td><strong>Toplam</strong></td><td class="r num"><strong>' + money(tb, 0) + '</strong></td><td class="r num"><strong>' + money(ta, 0) + '</strong></td><td class="r num"><strong>' + money(tbb, 0) + ' B<br>' + money(tab, 0) + ' A</strong></td></tr></tfoot></table></div>' +
      '<p class="small ' + (eq ? 'muted' : '') + '">' + (eq ? 'Borç ve alacak toplamları eşit.' : 'Toplamlar eşit değil.') + '</p>' +
      '<div class="row" data-reset-box><button type="button" class="btn ghost small" data-reset="abc">ABC kayıtlarını sıfırla</button></div></section>';
  }
  function newFreeItem() {
    const pool = TEMPLATES.filter((t) => !free.topic || t.topic === free.topic);
    let t = pick(pool), guard = 0;
    while (pool.length > 1 && t.id === free.lastId && guard++ < 10) t = pick(pool);

  }

      '<p class="muted">' + TEMPLATES.length + ' işlem türünden rastgele sorular; tutarlar her seferinde değişir. KDV oranı %20.</p>' +
      '<div class="form"><label class="f" for="freeTopic">Konu<select id="freeTopic"><option value="">Bütün konular</option>' + topics.map((k) => '<option value="' + k + '"' + (k === free.topic ? ' selected' : '') + '>' + esc(TOPICS[k].t) + '</option>').join('') + '</select></label>' +
        '<div class="f"><span>Sonuç</span><strong class="mono" id="freeScore" style="min-height:44px;display:flex;align-items:center">' + practice.dogru + ' doğru / ' + practice.toplam + ' soru</strong></div></div>' +

        '<div data-fb="free" aria-live="polite"></div></section>';
    fillSelects('free', free.rows); drawTotals('free');
  }
  const fb = (key, kind, html) => { const el = $('[data-fb="' + key + '"]'); if (el) el.innerHTML = '<div class="note ' + kind + '">' + html + '</div>'; };
  const setRows = (key, rows) => { if (key === 'abc') abcDrafts[abcIndex] = rows; else free.rows = rows; };
  function runCheck(key) {
    const target = key === 'abc' ? ABC[abcIndex] : free.item;
    const r = checkRows(readRows(key), target.sol, target.kdv);
    if (key === 'free' && r.kind !== 'err' && !free.counted) {
      free.counted = true; practice.toplam += 1;

    }
    if (r.kind !== 'ok') { fb(key, r.kind, r.msg); return; }
    if (key === 'abc' && !abcDone[abcIndex]) { abcDone[abcIndex] = true; Store.set('abc', abcDone); abcStatus(); }
    fb(key, 'ok', '<strong>Doğru.</strong>' + (target.note ? ' ' + esc(target.note) : '') + '<div class="scroll" style="margin-top:8px">' + journalTable(target.sol, null, target.exp) + '</div>');
  }

  }
  function bindPractice() {
    const p = $('#p-alistirma');
    const sync = (key) => { setRows(key, readRows(key)); drawTotals(key); };
    p.addEventListener('input', (e) => { const ent = e.target.closest('[data-entry]'); if (ent) { sync(ent.dataset.entry); $('[data-fb="' + ent.dataset.entry + '"]').innerHTML = ''; } });
    p.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || !e.target.classList.contains('e-amt')) return;
      e.preventDefault(); runCheck(e.target.closest('[data-entry]').dataset.entry);
    });
    p.addEventListener('change', (e) => {
      if (e.target.id === 'freeTopic') { free.topic = e.target.value; newFreeItem(); renderFree(); return; }
      const ent = e.target.closest('[data-entry]'); if (ent) sync(ent.dataset.entry);
    });
    p.addEventListener('click', (e) => {
      const t = e.target.closest('button');
      if (!t || !p.contains(t)) return;
      const d = t.dataset;
      if (d.tab) { if (d.tab !== pracTab) { pracTab = d.tab; Store.set('pratikSekme', pracTab); renderAlistirma(); } return; }
      if (d.side) {
        $$('button', t.parentElement).forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
        const key = t.closest('[data-entry]').dataset.entry; sync(key); $('[data-fb="' + key + '"]').innerHTML = ''; return;
      }
      if (d.del != null) {
        const key = t.closest('[data-entry]').dataset.entry;
        if ($$('[data-entry="' + key + '"] .erow').length <= 2) { fb(key, 'err', 'Bir kayıtta en az iki satır olur.'); return; }
        t.closest('.erow').remove(); renumber(key); sync(key); $('[data-fb="' + key + '"]').innerHTML = ''; return;
      }
      if (d.add) {
        const ent = $('[data-entry="' + d.add + '"]');
        ent.insertAdjacentHTML('beforeend', rowHtml(d.add, ent.children.length, { a: '', s: '', t: '' }));
        sync(d.add); ent.lastElementChild.querySelector('.e-acc').focus(); return;
      }
      if (d.check) { runCheck(d.check); return; }

      if (t.hasAttribute('data-new')) { newFreeItem(); renderFree(); return; }
      if (d.step != null) { abcIndex = intIn(+d.step, 0, ABC.length - 1, 0); Store.set('abcIndex', abcIndex); renderAbc(); const box = $('#pracBody .box'); if (box && box.getBoundingClientRect().top < 0) box.scrollIntoView(); return; }
      if (d.reset) { t.closest('[data-reset-box]').innerHTML = '<span class="small">Tamamlanan ABC kayıtları silinsin mi?</span><button type="button" class="btn small" data-reset-yes>Sil</button><button type="button" class="btn ghost small" data-reset-no>Vazgeç</button>'; return; }
      if (t.hasAttribute('data-reset-yes')) { abcDone = {}; Store.set('abc', abcDone); Object.keys(abcDrafts).forEach((k) => delete abcDrafts[k]); abcIndex = 0; Store.set('abcIndex', 0); renderAbc(); return; }
      if (t.hasAttribute('data-reset-no')) renderAbc();
    });
  }

  /* ---------- 21. TEKRAR: TEST ---------- */
  const uniq = (arr) => arr.filter((v, i) => arr.indexOf(v) === i);
  function distractors(correct, pool, n = 3) { return shuffle(uniq(pool.filter((v) => v !== correct))).slice(0, n); }
  const GEN = [
    () => { const a = pick(ACCOUNTS); const same = ACCOUNTS.filter((x) => x.cls === a.cls).map((x) => x.name);
      const w = distractors(a.name, same.length > 4 ? same : ACCOUNTS.map((x) => x.name));
      return { q: a.code + ' numaralı hesap hangisidir?', a: a.name, opts: shuffle([a.name, ...w]), x: a.code + ' ' + a.name + ', ' + a.grp + ' ' + (GROUPS[a.grp] || '') + ' grubundadır.' }; },
    () => { const a = pick(ACCOUNTS), r = a.up === 'B' ? 'Borç tarafında' : 'Alacak tarafında';
      return { q: accLabel(a.code) + ' hesabı hangi tarafta artar?', a: r, opts: ['Borç tarafında', 'Alacak tarafında'], x: a.text }; },
    () => { const a = pick(ACCOUNTS), r = CLASSES[a.cls];
      return { q: accLabel(a.code) + ' hangi hesap sınıfındadır?', a: r, opts: shuffle([r, ...distractors(r, Object.values(CLASSES))]), x: 'Kodun ilk hanesi (' + a.cls + ') sınıfı gösterir.' }; },
    () => { const x = amt(1000, 50000), k = x * 0.2, r = money(k) + ' TL';
      const w = uniq([money(x * 0.18) + ' TL', money(x * 0.1) + ' TL', money(x - x / 1.2) + ' TL', money(x * 1.2) + ' TL'].filter((v) => v !== r)).slice(0, 3);
      return { q: 'KDV hariç ' + tl(x) + ' tutarın %20 KDV\'si kaç TL?', a: r, opts: shuffle([r, ...w]), x: money(x) + ' × 0,20 = ' + money(k) + ' TL.' }; },
    () => { const x = amt(1000, 50000), t = x * 1.2, r = money(x) + ' TL';
      const w = uniq([money(t * 0.8) + ' TL', money(t / 1.18) + ' TL', money(t * 0.82) + ' TL', money(t - t * 0.18) + ' TL'].filter((v) => v !== r)).slice(0, 3);
      return { q: 'KDV dahil ' + tl(t) + ' tutarın KDV hariç bedeli (matrahı) kaç TL?', a: r, opts: shuffle([r, ...w]), x: money(t) + ' ÷ 1,20 = ' + money(x) + ' TL. %20 düşmek (× 0,80) yanlış sonuç verir.' }; }
  ];
  function makeTest(n = 10) {
    const bank = shuffle(QUESTIONS).slice(0, 5).map((q) => ({ q: q.q, a: q.a, opts: shuffle([q.a, ...q.w]), x: q.x }));
    const gen = shuffle(GEN.concat(GEN)).slice(0, n - bank.length).map((g) => g());
    return shuffle(bank.concat(gen));
  }
  let test = null;
  function renderTekrar() {
    const tab = Store.get('tekrarSekme', 'test') === 'kart' ? 'kart' : 'test';
    $('#p-tekrar').innerHTML = '<header class="stack"><h1>Tekrar</h1></header>' +
      '<div class="tabs" role="tablist"><button type="button" role="tab" id="tab-test" aria-controls="revBody" data-rtab="test" aria-selected="' + (tab === 'test') + '">Test</button><button type="button" role="tab" id="tab-kart" aria-controls="revBody" data-rtab="kart" aria-selected="' + (tab === 'kart') + '">Kartlar</button></div>' +
      '<div id="revBody" class="stack-lg" role="tabpanel" aria-labelledby="tab-' + tab + '"></div>';
    if (tab === 'test') renderTest(); else renderCards();
  }
  function renderTest() {
    const body = $('#revBody');
    if (!test) {
      const hist = quizHist.slice(-5).reverse();
      body.innerHTML = '<p class="muted">Her test 10 sorudan oluşur: yarısı soru bankasından (' + QUESTIONS.length + ' soru), yarısı hesap planı ve KDV üzerine rastgele üretilir.</p>' +
        '<div><button type="button" class="btn primary" data-test-start>Testi başlat</button></div>' +
        (hist.length ? '<section class="stack"><h2>Son testler</h2><ul class="list">' + hist.map((h) => '<li class="row between"><span>' + esc(fDate(new Date(h.t), { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })) + '</span><span class="mono">' + h.d + '/' + h.n + '</span></li>').join('') + '</ul></section>' : '');
      return;
    }
    if (test.i >= test.qs.length) {
      const d = test.ans.filter((a, i) => a === test.qs[i].a).length;
      const wrong = test.qs.map((q, i) => ({ q, a: test.ans[i] })).filter((x) => x.a !== x.q.a);
      body.innerHTML = '<section class="box stack"><p class="big mono">' + d + '/' + test.qs.length + '</p><p class="muted">' + (wrong.length ? wrong.length + ' soruda hata var.' : 'Bütün cevaplar doğru.') + '</p></section>' +
        (wrong.length ? '<section class="stack"><h2>Yanlış cevaplar</h2><ul class="list">' + wrong.map((w) => '<li class="stack" style="gap:4px"><strong>' + esc(w.q.q) + '</strong><span class="small" style="color:var(--err)">Senin cevabın: ' + esc(w.a) + '</span><span class="small" style="color:var(--ok)">Doğru cevap: ' + esc(w.q.a) + '</span><span class="small muted">' + esc(w.q.x) + '</span></li>').join('') + '</ul></section>' : '') +
        '<div class="row"><button type="button" class="btn primary" data-test-start>Yeni test</button><button type="button" class="btn ghost" data-test-close>Kapat</button></div>';

    body.innerHTML = '<div class="row between"><span class="small muted">Soru ' + (test.i + 1) + '/' + test.qs.length + '</span><div class="bar" style="flex:1;max-width:220px"><i style="width:' + Math.round(test.i / test.qs.length * 100) + '%"></i></div></div>' +
      '<section class="stack"><h2>' + esc(q.q) + '</h2><div class="opts">' + q.opts.map((o, k) => {

  /* ---------- 22. TEKRAR: KARTLAR ---------- */
  const KAVRAMLAR = (TOPICS.temel.b.find((x) => x.tbl) || { tbl: { rows: [] } }).tbl.rows;
  const DECKS = {
    hesap: { t: 'Hesap kodları', cards: ACCOUNTS.map((a) => ({ id: 'h:' + a.code, f: a.code, b: a.name + ' · ' + (a.up === 'B' ? 'borçta artar' : 'alacakta artar') + ' · ' + a.grp + ' ' + (GROUPS[a.grp] || '') })) },

  let card = null, flipped = false;

  function nextCard() {

  function drawGnoRows() {
    $('#gnoRows').innerHTML = gnoRows.map((r, i) => '<div class="gnorow" data-gno="' + i + '">' +
      '<label class="f gn">Ders<input type="text" data-f="n" value="' + esc(r.n) + '" autocomplete="off"></label>' +

      '<button type="button" class="icon-btn" data-gno-del="' + i + '" aria-label="' + (i + 1) + '. dersi sil">×</button></div>').join('');
  }
  function calcAll() { calcFinal(); calcGno(); calcKdv(); calcFaiz(); calcKar(); calcAmort(); }
  function calcFinal() {
    const withOdev = $('#gPreset').value === '20-20-60';
    $('#lOdev').hidden = !withOdev;
    const bad = (id) => { const v = $('#' + id).value; return v === '' || isNaN(+v) || +v < 0 || +v > 100; };
    setErr('gVize', bad('gVize') ? '0 ile 100 arasında olmalı.' : ''); setErr('gOdev', withOdev && bad('gOdev') ? '0 ile 100 arasında olmalı.' : '');
    if (bad('gVize') || (withOdev && bad('gOdev'))) { $('#gOut').textContent = '—'; $('#gWhy').textContent = ''; return; }
    const v = +$('#gVize').value, o = +$('#gOdev').value;
    const known = withOdev ? 0.2 * v + 0.2 * o : 0.4 * v;
    const raw = Math.ceil((60 - known) / 0.6 - 1e-9), need = Math.max(50, raw);
    if (need > 100) { $('#gOut').textContent = '—'; $('#gWhy').textContent = 'Finalden 100 alınsa bile ortalama ' + (known + 60).toFixed(1).replace('.', ',') + ' olur; 60\'a ulaşmıyor. Bütünlemede de aynı hesap geçerli.'; return; }
    $('#gOut').textContent = need;
    $('#gWhy').textContent = raw <= 50 ? 'Ortalama için ' + Math.max(0, raw) + ' yeterdi; ancak final notu en az 50 olmalı.' : 'Bu notla ortalama ' + (known + 0.6 * need).toFixed(1).replace('.', ',') + ' olur.';
  }
  function calcGno() {
    let sk = 0, sp = 0, bad = 0;
    gnoRows.forEach((r) => { const k = parseAmount(r.k); if (k > 0) { sk += k; sp += k * LETTER[r.h]; } else if (String(r.k).trim()) bad++; });
    $('#gnoOut').textContent = sk ? (sp / sk).toFixed(2).replace('.', ',') : '—';
    $('#gnoWhy').textContent = (sk ? 'Toplam kredi ' + money(sk, 0) + '. ' : 'Kredi gir. ') + (bad ? bad + ' satırdaki kredi okunamadı.' : '');
  }
  function calcKdv() {
    const t = numIn('kTutar'), r = +$('#kOran').value / 100, dahil = $('#kYon').value === 'dahil';
    if (!(t > 0)) { setErr('kTutar', 'Sıfırdan büyük bir tutar gir.'); $('#kOut').innerHTML = ''; $('#kWhy').textContent = ''; return; }
    setErr('kTutar');
    const base = dahil ? t / (1 + r) : t, k = base * r;
    $('#kOut').innerHTML = [['Matrah (KDV hariç)', base], ['KDV', k], ['KDV dahil', base + k]].map(([l, v]) => '<div class="stat"><span>' + l + '</span><b>' + money(v) + '</b></div>').join('');
    $('#kWhy').textContent = dahil ? money(t) + ' ÷ ' + (1 + r).toFixed(2).replace('.', ',') + ' = ' + money(base) : money(t) + ' × ' + r.toFixed(2).replace('.', ',') + ' = ' + money(k) + ' KDV';
  }
  function calcFaiz() {
    const A = numIn('fA'), R = numIn('fR'), G = numIn('fG'), Y = +$('#fY').value;
    setErr('fA', A > 0 ? '' : 'Sıfırdan büyük olmalı.'); setErr('fR', R > 0 ? '' : 'Sıfırdan büyük olmalı.'); setErr('fG', G > 0 ? '' : 'Sıfırdan büyük olmalı.');
    if (!(A > 0 && R > 0 && G > 0)) { $('#fOut').innerHTML = ''; $('#fWhy').textContent = ''; return; }
    const f = A * R * G / (100 * Y);
    $('#fOut').innerHTML = '<div class="stat"><span>Faiz</span><b>' + money(f) + '</b></div><div class="stat"><span>Anapara + faiz</span><b>' + money(A + f) + '</b></div>';
    $('#fWhy').textContent = 'Faiz = ' + money(A) + ' × ' + money(R, 0) + ' × ' + money(G, 0) + ' ÷ (100 × ' + Y + ')';
  }
  function calcKar() {
    const M = numIn('pM'), K = numIn('pK'), onSale = $('#pE').value === 's';
    setErr('pM', M > 0 ? '' : 'Sıfırdan büyük olmalı.');
    const kOk = K >= 0 && (!onSale || K < 100);
    setErr('pK', kOk ? '' : (onSale ? '0 ile 100 arasında olmalı (100 hariç).' : 'Sıfır ya da daha büyük olmalı.'));
    if (!(M > 0) || !kOk) { $('#pOut').innerHTML = ''; $('#pWhy').textContent = ''; return; }
    const S = onSale ? M / (1 - K / 100) : M * (1 + K / 100), P = S - M;
    $('#pOut').innerHTML = [['Satış fiyatı', money(S)], ['Kâr', money(P)], ['Maliyete göre kâr', '%' + (P / M * 100).toFixed(2).replace('.', ',')], ['Satışa göre kâr', '%' + (P / S * 100).toFixed(2).replace('.', ',')]].map(([l, v]) => '<div class="stat"><span>' + l + '</span><b>' + v + '</b></div>').join('');
    $('#pWhy').textContent = onSale ? 'Satış = Maliyet ÷ (1 − kâr oranı)' : 'Satış = Maliyet × (1 + kâr oranı)';
  }
  function calcAmort() {
    const M = numIn('aM'), N = +$('#aN').value, dec = $('#aY').value === 'a';
    setErr('aM', M > 0 ? '' : 'Sıfırdan büyük olmalı.'); setErr('aN', Number.isInteger(N) && N >= 1 && N <= 50 ? '' : '1 ile 50 arasında bir tam sayı olmalı.');
    if (!(M > 0) || !(Number.isInteger(N) && N >= 1 && N <= 50)) { $('#aOut').innerHTML = ''; $('#aWhy').textContent = ''; return; }
    const rate = dec ? Math.min(2 / N, 0.5) : 1 / N;
    let kalan = cents(M), bir = 0, rows = '';
    for (let y = 1; y <= N; y++) {
      const a = y === N ? kalan : (dec ? Math.round(kalan * rate) : Math.round(cents(M) / N));
      kalan -= a; bir += a;
      rows += '<tr><td class="num">' + y + '</td><td class="r num">' + money(a / 100) + '</td><td class="r num">' + money(bir / 100) + '</td><td class="r num">' + money(kalan / 100) + '</td></tr>';
    }
    $('#aOut').innerHTML = '<table class="t"><thead><tr><th>Yıl</th><th class="r">Amortisman</th><th class="r">Birikmiş</th><th class="r">Kalan değer</th></tr></thead><tbody>' + rows + '</tbody></table>';
    $('#aWhy').textContent = 'Oran %' + (rate * 100).toFixed(2).replace('.', ',') + (dec ? ' (normal oranın iki katı, en fazla %50). Son yıl kalan değerin tamamı ayrılır. Yalnızca bilanço esasına göre defter tutanlar seçebilir.' : '. Kayıt: 770 (ya da ilgili gider hesabı) borç, 257 alacak.');
  }
  function bindAraclar() {
    const p = $('#p-araclar');
    const route = (el) => {
      const id = el.id || '';
      if (/^(gPreset|gVize|gOdev)$/.test(id)) calcFinal();
      else if (/^(kTutar|kOran|kYon)$/.test(id)) calcKdv();
      else if (/^(fA|fR|fG|fY)$/.test(id)) calcFaiz();
      else if (/^(pM|pK|pE)$/.test(id)) calcKar();
      else if (/^(aM|aN|aY)$/.test(id)) calcAmort();
      else if (el.dataset.f) { const i = +el.closest('[data-gno]').dataset.gno; gnoRows[i][el.dataset.f] = el.value; Store.set('gno', gnoRows); calcGno(); }
    };
    p.addEventListener('input', (e) => route(e.target));
    p.addEventListener('change', (e) => route(e.target));
    p.addEventListener('click', (e) => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.dataset.jump) { const s = $('#' + t.dataset.jump); if (s) s.scrollIntoView({ block: 'start' }); return; }
      if (t.hasAttribute('data-gno-add')) { gnoRows.push({ n: '', k: '', h: 'CC' }); Store.set('gno', gnoRows); drawGnoRows(); calcGno(); return; }
      if (t.dataset.gnoDel != null) { gnoRows.splice(+t.dataset.gnoDel, 1); if (!gnoRows.length) gnoRows.push({ n: '', k: '', h: 'CC' }); Store.set('gno', gnoRows); drawGnoRows(); calcGno(); }
    });
  }

  // Denetim küçük işlere bölünür ve tarayıcının boş zamanlarında çalışır; ekranı dondurmaz.
  function auditJobs() {
    const out = [], jobs = [], ok = (t, pass, extra) => out.push({ t, pass: !!pass, extra: extra || '' });
    const balanced = (sol) => sol.reduce((p, [, s, v]) => p + (s === 'B' ? cents(v) : -cents(v)), 0) === 0 && sol.every(([c, s, v]) => ACC[c] && (s === 'B' || s === 'A') && v > 0);
    jobs.push(() => {
      ok('Hesap kodları benzersiz', new Set(ACCOUNTS.map((a) => a.code)).size === ACCOUNTS.length);
      ok('Her hesabın grubu ve konusu tanımlı', ACCOUNTS.every((a) => GROUPS[a.grp] && TOPICS[a.topic]));
      const exs = TOPIC_ORDER.flatMap((k) => TOPICS[k].b.filter((x) => x.ex).map((x) => x.ex));
      ok('Konu notlarındaki örnek kayıtlar denk', exs.every((e) => balanced(e.sol)), exs.length + ' örnek');
      ok('ABC kayıtları denk', ABC.every((e) => balanced(e.sol)), ABC.length + ' kayıt');
      const bal = (code) => ABC.slice(0, 9).reduce((p, e) => p + e.sol.filter((l) => l[0] === code).reduce((q, l) => q + (l[1] === 'B' ? l[2] : -l[2]), 0), 0);
      const m = ABC[9].sol, amtOf = (c, s) => (m.find((l) => l[0] === c && l[1] === s) || [0, 0, 0])[2];
      ok('ABC KDV mahsubu önceki kayıtlarla tutarlı', bal('191') === amtOf('191', 'A') && -bal('391') === amtOf('391', 'B'), '191: ' + money(bal('191'), 0) + ', 391: ' + money(-bal('391'), 0));
    });
    let tplOk = true, n = 0;
    TEMPLATES.forEach((t) => jobs.push(() => { for (let i = 0; i < 20; i++) { const g = t.gen(); n++; if (!balanced(g.sol) || !g.sol.every((l) => Number.isInteger(l[2])) || checkRows(g.sol.map(([a, s, v]) => ({ a, s, t: String(v) })), g.sol, g.kdv).kind !== 'ok') tplOk = false; } }));
    jobs.push(() => {
      ok('Alıştırma şablonları denk ve denetimden geçiyor', tplOk, TEMPLATES.length + ' şablon, ' + n + ' örnek');
      ok('Soru bankası seçenekleri tutarlı', QUESTIONS.every((q) => q.w.length === 3 && !q.w.includes(q.a) && new Set(q.w).size === 3), QUESTIONS.length + ' soru');
    });
    let genOk = true;
    for (let j = 0; j < 4; j++) jobs.push(() => { for (let i = 0; i < 50; i++) { const g = pick(GEN)(); if (!g.opts.includes(g.a) || new Set(g.opts).size !== g.opts.length || g.opts.length < 2) genOk = false; } });
    jobs.push(() => ok('Üretilen test soruları tutarlı', genOk, '200 örnek'));
    jobs.push(() => auditRest(ok));
    return { jobs, out };
  }
  function runAudit(done) {
    const { jobs, out } = auditJobs();
    let i = 0;
    // Tarayıcı boş an bildirmezse çağrı zaman aşımıyla gelir (timeRemaining 0); o zaman 8 ms'lik pay kullanılır.
    const step = (dl) => {
      const t0 = performance.now();
      do { jobs[i++](); } while (i < jobs.length && (dl && dl.timeRemaining && !dl.didTimeout ? dl.timeRemaining() > 6 : performance.now() - t0 < 8));
      if (i < jobs.length) idle(step, 200); else done(out);
    };
    idle(step, 200);
  }

  function restore(file) {
    const out = (kind, m) => { $('#backupMsg').innerHTML = '<div class="note ' + kind + '">' + esc(m) + '</div>'; };

      let d;

      if (!d || d.uygulama !== 'Mizan' || !d.veri || typeof d.veri !== 'object') { out('err', 'Bu dosya bir Mizan yedeği değil.'); return; }

      });

      location.hash = 'hakkinda'; location.reload();
    };
    r.onerror = () => out('err', 'Dosya okunamadı.');
    r.readAsText(file);
  }

  // Açılıştan sonra tarayıcı boştayken sayfalar görünmeden hazırlanır ve bir kez yerleştirilir.
  // Gizli sayfa çizim durumunu koruduğu için ilk ziyaret de beklemesiz olur.
  const PREWARM = ['notlar', 'alistirma', 'tekrar', 'hesaplar', 'araclar', 'takvim', 'dersler', 'sozluk', 'diger', 'nasil', 'hakkinda'];
  let prewarmTimer = 0;
  function prewarm() {
    if (!(window.CSS && CSS.supports && CSS.supports('content-visibility', 'hidden'))) return;
    if (navigator.deviceMemory && navigator.deviceMemory < 1) return;
    clearTimeout(prewarmTimer);
    let i = 0, bekleyen = null;
    const step = () => {
      if (document.hidden) { prewarmTimer = setTimeout(() => idle(step), 1000); return; }
      if (bekleyen) {
        const el = $('#p-' + bekleyen); bekleyen = null;
        if (el.hidden) { el.classList.add('isin'); void el.offsetHeight; el.classList.remove('isin'); }
        idle(step); return;
      }
      while (i < PREWARM.length && (!dirty.has(PREWARM[i]) || PREWARM[i] === current)) i++;
      if (i >= PREWARM.length) return;
      bekleyen = PREWARM[i++]; ensure(bekleyen); idle(step);
    };
    prewarmTimer = setTimeout(() => idle(step), 1200);
  }

    if (t.hasAttribute('data-backup')) { backup(); return; }
    if (t.hasAttribute('data-restore')) { $('#restoreFile').click(); return; }
    if (t.hasAttribute('data-wipe')) { $('#resetBox').innerHTML = '<span class="small">ABC kayıtları, alıştırma sonuçları, testler, kartlar, ortalama ve takvim işaretleri silinsin mi?</span><button type="button" class="btn small" data-wipe-yes>Sil</button><button type="button" class="btn ghost small" data-wipe-no>Vazgeç</button>'; return; }
    if (t.hasAttribute('data-wipe-yes')) { wipe(); refresh(); $('#resetBox').insertAdjacentHTML('beforeend', '<span class="small muted">Silindi.</span>'); return; }
    if (t.hasAttribute('data-wipe-no')) renderHakkinda();
  });
  document.addEventListener('change', (e) => {
    if (e.target.matches('[data-campus]')) { campusKey = CAMPUS[e.target.value] ? e.target.value : 'tokat'; Store.set('campus', campusKey); refresh(); return; }
    if (e.target.id === 'themeSel') { setTheme(e.target.value); return; }
    if (e.target.id === 'restoreFile') { restore(e.target.files && e.target.files[0]); e.target.value = ''; return; }
    if (e.target.matches('[data-chk]')) { checks[e.target.dataset.chk] = e.target.checked; Store.set('checks', checks); }
  });
  const onHash = () => { const [p, a] = parseHash(); if (p !== current || a !== currentArg) go(p, a, false); };
  window.addEventListener('popstate', onHash);
  window.addEventListener('hashchange', onHash);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    const t = todayDate();
    if (+t === +TODAY) return;
    TODAY = t; loadYear(); refresh();
  });
  if (mqDark && mqDark.addEventListener) mqDark.addEventListener('change', paintTheme);
  bindPractice(); bindTekrar(); bindAraclar();
  renderNav(); paintTheme();
  const [p0, a0] = parseHash();
  go(p0, a0, false);
  try { performance.mark('mizan-hazir'); } catch (e) { /* ölçüm desteklenmiyor */ }
  prewarm();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* çerçeve ya da yerel dosya: çevrimdışı önbellek yok */ }); });
  }
})();
</script>
</body>
</html>
